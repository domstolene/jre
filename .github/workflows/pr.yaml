name: PR

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: false
          load: true
          tags: jre:pr
          platforms: linux/amd64
          provenance: false
          sbom: false

      - name: Validate Java runtime
        run: docker run --rm --pull=never --platform linux/amd64 jre:pr --version

      - name: Validate blocked certificates
        run: |
          set -euo pipefail
          image_name=jre:pr
          docker run --rm --pull=never --platform linux/amd64 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/src,dst=/check,readonly" \
            $image_name --source 25 /check/CheckEmudhra.java --require-blocked

